name: DCO

# Every commit in a pull request must carry a "Signed-off-by: Name <email>" line (git commit -s)
# whose email is the commit author's. Plain git and shell, no third-party action.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          total=0
          bad=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            total=$((total + 1))
            email=$(git log -1 --format=%ae "$sha")
            if ! git log -1 --format=%B "$sha" | grep -E '^Signed-off-by: .+ <.+>$' | grep -Fq "<$email>"; then
              echo "::error::commit $sha has no Signed-off-by line for <$email>. Fix with: git rebase --signoff $BASE_SHA"
              bad=$((bad + 1))
            fi
          done
          echo "checked $total commits, $bad without a matching sign-off"
          if [ "$total" -eq 0 ]; then
            echo "::error::0 commits checked: a check that inspects nothing is not a pass"
            exit 1
          fi
          [ "$bad" -eq 0 ]
