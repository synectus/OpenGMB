name: syngmb

services:
  postgres:
    image: postgres:16
    container_name: syngmb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: syngmb
      POSTGRES_PASSWORD: syngmb
      POSTGRES_DB: syngmb
    ports:
      - "54329:5432"
    volumes:
      - syngmb_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syngmb -d syngmb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  syngmb_pgdata:
